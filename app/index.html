<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icon-192x192.png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- System bar follows the canvas; ThemeColorSync overrides for explicit Light/Dark. -->
    <meta
      name="theme-color"
      content="#f4efe6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#191715"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      No apple-mobile-web-app-status-bar-style. black-translucent is what makes
      iOS 26.1 and iOS 27 draw a blur over the notch and down across the top of
      an installed PWA, and default does not stop it either. Apple's guidance
      is to omit the tag so the status bar takes the page color. iOS reads the
      tag when the icon is added to the Home Screen. The #ios-status-shield
      element is what stops the blur on an already-installed icon.
    -->
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("theme");
          var systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var isDark =
            storedTheme === "dark" || (storedTheme !== "light" && systemDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
          var ua = window.navigator.userAgent || "";
          var iOS =
            /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          var standalone =
            window.navigator.standalone === true ||
            (iOS && window.matchMedia("(display-mode: standalone)").matches);
          if (iOS && standalone) {
            document.documentElement.classList.add("ios-standalone");
          }
          var palette = localStorage.getItem("upwards-color-palette");
          if (palette) {
            document.documentElement.setAttribute("data-palette", palette);
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <title>Upwards</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Real element, not a pseudo. iOS 26/27 only stops the top blur when it can
      sample a fixed, solid, full-width bar within a few pixels of the top.
      Shown only while html.ios-standalone is set.
    -->
    <div id="ios-status-shield" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
