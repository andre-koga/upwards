<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icon-192x192.png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- System bar follows the canvas; ThemeColorSync overrides for explicit Light/Dark. -->
    <meta
      name="theme-color"
      content="#f4efe6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#191715"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      default, not black-translucent. From iOS 26.1 the translucent style makes
      the system draw a blur over the notch and the top of an installed PWA.
      iOS reads this tag when the icon is added to the Home Screen.
      viewport-fit=cover stays so env(safe-area-inset-top) is available; the
      ios-standalone class paints an opaque canvas strip in that inset.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("theme");
          var systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var isDark =
            storedTheme === "dark" || (storedTheme !== "light" && systemDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
          var ua = window.navigator.userAgent || "";
          var iOS =
            /iPad|iPhone|iPod/.test(ua) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          var standalone =
            window.navigator.standalone === true ||
            (iOS && window.matchMedia("(display-mode: standalone)").matches);
          if (iOS && standalone) {
            document.documentElement.classList.add("ios-standalone");
          }
          var palette = localStorage.getItem("upwards-color-palette");
          if (palette) {
            document.documentElement.setAttribute("data-palette", palette);
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <title>Upwards</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
