<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      Single theme-color + color-scheme (no media queries): the in-app theme
      can differ from the OS preference. theme-color drives the top status bar;
      color-scheme drives the Android nav bar in a standalone PWA.
      The inline script below sets both before paint; React keeps them in sync.
    -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      black-translucent lets the page background show through the iOS status bar
      (true custom colors aren't supported there — matching body bg is the fix).
    -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <title>Upwards</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("theme");
          var systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var isDark =
            storedTheme === "dark" ||
            (storedTheme !== "light" && systemDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
          var palette = localStorage.getItem("upwards-color-palette");
          if (palette) {
            document.documentElement.setAttribute("data-palette", palette);
          }
          var themeColor = isDark ? "#0a0a0a" : "#ffffff";
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute("content", themeColor);
          var schemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (schemeMeta)
            schemeMeta.setAttribute("content", isDark ? "dark" : "light");
          document.documentElement.style.backgroundColor = themeColor;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
