name: Supabase migrate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  db-push:
    name: Push migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Link project for IPv4 database access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing GitHub secrets SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF."
            echo "Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "Vercel does not apply Postgres migrations."
            exit 1
          fi
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing GitHub secrets SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF."
            echo "Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "Vercel does not apply Postgres migrations."
            exit 1
          fi
          # --include-all is required when a historical local migration was never
          # recorded on this remote (out-of-order history). Without it, later
          # migrations such as ops-only snapshot never apply.
          #
          # The CLI often fails once with login-role status 544 / connection
          # timeout before any SQL runs. Retry that class of error; a failure
          # after migrations have started still fails the job.
          delay=15
          for attempt in 1 2 3 4; do
            echo "db push attempt ${attempt}/4"
            if pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes --include-all; then
              exit 0
            fi
            if [ "$attempt" = "4" ]; then
              echo "db push failed after 4 attempts."
              echo "If the log shows login-role status 544 or a connection timeout, re-run this workflow."
              echo "Optional: add SUPABASE_DB_PASSWORD so the CLI uses the postgres role instead of a temp login role."
              exit 1
            fi
            echo "Retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
          done
