name: Supabase migrate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  db-push:
    name: Push migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Link project for IPv4 database access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing GitHub secrets SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF."
            echo "Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "Vercel does not apply Postgres migrations."
            exit 1
          fi
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing GitHub secrets SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF."
            echo "Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "Vercel does not apply Postgres migrations."
            exit 1
          fi
          # --include-all is required when a historical local migration was never
          # recorded on this remote (out-of-order history). Without it, later
          # migrations such as ops-only snapshot never apply.
          pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_REF" --yes --include-all
